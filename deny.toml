# cargo-deny configuration (IDN-00). Run with `cargo deny check`.
#
# Gates every dependency for known advisories, acceptable licences, banned
# duplicates/wildcards and unexpected sources. Adding a dependency that fails
# here means changing this file in its own reviewed change (§8).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Never add an ignore without the issue ID that justifies it (§1.1).
ignore = []

[licenses]
version = 2
# Only well-known, permissive licences. A new dependency under a different
# licence requires an explicit, reviewed addition to this list.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
